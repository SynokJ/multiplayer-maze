<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d14;
      }

      /* The game fills the whole browser window; Unity resizes the render target to match. */
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
        background: #0b0d14;
        touch-action: none;
        outline: none;
      }

      #unity-loading-bar {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(60vw, 360px);
        text-align: center;
        font: 600 18px/1.4 system-ui, sans-serif;
        color: #a8b5d1;
      }

      #unity-progress-bar-empty {
        margin-top: 14px;
        height: 10px;
        border-radius: 5px;
        background: #22273a;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #3885f2;
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        max-width: 90vw;
        z-index: 2;
        display: none;
        font: 14px/1.4 system-ui, sans-serif;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div>{{{ PRODUCT_NAME }}}</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Errors stay on screen (for example a wrong Content-Encoding on a compressed build);
      // warnings fade after a few seconds.
      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          banner.style.display = banner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == "error") div.style = "background: #c33; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: #d9a400; color: #000; padding: 10px;";
          setTimeout(function () {
            banner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#unity-loading-bar").style.display = "none";
          canvas.focus();
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
